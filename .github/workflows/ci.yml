name: Verify site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:seo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: VERCEL_ENV=preview npm run build -- --outDir dist-preview
      - run: node tests/seo.mjs dist-preview --noindex
